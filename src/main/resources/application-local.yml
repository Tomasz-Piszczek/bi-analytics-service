spring:
  application:
    name: bi-analytics-service
  datasource:
    url: "${COMARCH_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CDN_F_P_U_H__Piszczek;encrypt=true;trustServerCertificate=true}"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${COMARCH_DB_USER:myapp}
    password: ${COMARCH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        globally_quoted_identifiers: true
server:
  port: 8087

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}

app:
  jwt:
    secret: ${JWT_SECRET:myVerySecretKeyForJWTTokensThatShouldBeAtLeast32Characters}
    expiration: 86400000

employee-sync:
  enabled: ${EMPLOYEE_SYNC_ENABLED:false}
  base-url: ${GEARTRACK_API_INTERNAL_URL:http://127.0.0.1:8080}
  secret: ${EMPLOYEE_SYNC_SECRET:local-development-only}
